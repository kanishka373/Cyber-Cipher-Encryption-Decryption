<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://unpkg.com/lucide@latest"></script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cyber Cipher System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- MATRIX BACKGROUND -->
    <canvas id="matrixCanvas"></canvas>

    <div class="main-container">

        <div class="glass-card">

            <!-- TITLE -->

            <h1 class="title">

                Caesar Cipher

            </h1>

            <!-- FORM -->

            <form method="POST">

                <!-- TEXT -->

                <textarea
                    name="text"
                    class="form-control text-area"
                    rows="6"
                    placeholder="Enter your secret text..."
                    required></textarea>

                <!-- SHIFT -->

                <input
                    type="number"
                    name="shift"
                    class="form-control shift-input"
                    placeholder="Enter Shift Key"
                    required>

                <!-- ALGORITHM -->

                <select
                    name="algorithm"
                    class="form-control shift-input">

                    <option value="caesar">

                        Caesar Cipher

                    </option>

                    <option value="reverse">

                        Reverse Cipher

                    </option>

                </select>

                <!-- BUTTONS -->

                <div class="button-group">
<button type="submit" name="action" value="encrypt" class="btn custom-btn encrypt-btn">
    <i data-lucide="lock-keyhole"></i>
    Encrypt
</button>
            <button type="submit" name="action" value="decrypt" class="btn custom-btn decrypt-btn">
    <i data-lucide="lock-open"></i>
    Decrypt
</button>
<button type="button" onclick="clearFields()" class="btn custom-btn clear-btn">
    <i data-lucide="eraser"></i>
    Clear
</button>

                </div>

            </form>

            <!-- TERMINAL -->

            <div class="terminal-box">

                <div class="terminal-header">

                    HACKER TERMINAL

                </div>

                <div id="terminalContent"></div>

            </div>

            <!-- RESULT -->

            {% if result %}

            <div class="result-box">

                <h4>Encrypted / Decrypted Result</h4>

                <textarea
                    id="resultText"
                    class="form-control result-text"
                    rows="5"
                    readonly>{{ result }}</textarea>

                <!-- RESULT BUTTONS -->

                <div class="button-group">

            <button onclick="copyText()" class="btn copy-btn">
    <i data-lucide="copy"></i>
    Copy Result
</button>

                    <button onclick="downloadResult()" class="btn copy-btn">
    <i data-lucide="download"></i>
    Download Result
</button>

                </div>

            </div>

            {% endif %}

            <!-- QR CODE -->

            {% if qr_path %}

            <div class="qr-box text-center">

                <h4>QR Code</h4>

                <img
                    src="{{ qr_path }}"
                    width="200">

            </div>

            {% endif %}

            <!-- HISTORY -->

            <div class="history-box">

                <!-- HISTORY BUTTONS -->

                <div class="history-buttons">

                    <!-- SHOW HISTORY -->

                    <button
                        class="history-toggle"
                        onclick="toggleHistory()">

                        Show History

                    </button>

                    <!-- DELETE HISTORY -->

                    <a
                        href="/delete-history"
                        style="width:100%;">

                        <button
                            class="delete-history-btn"
                            type="button">

                            Delete History

                        </button>

                    </a>

                </div>

                <!-- HISTORY CONTENT -->

                <div id="historyContent">

                    <ul>

                        {% for item in history %}

                        <li>

                            {{ item[1] }}

                            →
                            {{ item[2] }}

                        </li>

                        {% endfor %}

                    </ul>

                </div>

            </div>
        </div>
    </div>
     <script>
    lucide.createIcons();
</script>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
